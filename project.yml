name: AgentShield
options:
  bundleIdPrefix: com.agentshield
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
targets:
  AgentShield:
    type: application
    platform: macOS
    sources: [AgentShield]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentshield.app
        PRODUCT_NAME: Agent Shield
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 0.2
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Agent Shield
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: Agent Shield captures the desktop for authorized agents while excluding its privacy-shield overlays.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
